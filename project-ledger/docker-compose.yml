services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: java_ledger
    ports:
      - "3307:3306"
    volumes:
      - ledger-mysql:/var/lib/mysql
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  app:
    build: .
    ports:
      - "8091:8091"
    depends_on:
      - mysql
      - redis
volumes:
  ledger-mysql:
