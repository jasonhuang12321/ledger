<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的记账本</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page">
<h1>你好，<span th:text="${username}">用户</span></h1>
<form th:action="@{/logout}" method="post">
    <button type="submit">退出登录</button>
</form>
<p th:if="${admin}"><a href="/admin">管理员：查看全部账单</a></p>

<div class="summary">
    <div>收入合计：<b class="income" th:text="${income}">0</b> 元</div>
    <div>支出合计：<b class="expense" th:text="${expense}">0</b> 元</div>
    <div>结余：<b th:text="${balance}">0</b> 元</div>
</div>

<form action="/" method="get">
    <p>
        月份：
        <input type="month" name="month" th:value="${month}">
        <button type="submit">筛选</button>
        <a href="/">查看全部</a>
        <a th:href="@{/export(month=${month})}">导出 Excel</a>
    </p>
</form>

<h2>支出分类统计</h2>
<table class="ledger" th:if="${!#lists.isEmpty(categoryStats)}">
    <tr>
        <th>分类</th>
        <th>金额</th>
    </tr>
    <tr th:each="s : ${categoryStats}">
        <td th:text="${s.category}">餐饮</td>
        <td th:text="${s.amount}">0</td>
    </tr>
</table>
<p th:if="${#lists.isEmpty(categoryStats)}">还没有支出记录。</p>

<h2>记一笔</h2>
<p class="error" th:if="${formError}" th:text="${formError}"></p>
<form th:action="@{/add}" method="post">
    <p>
        类型：
        <label><input type="radio" name="type" value="支出" checked> 支出</label>
        <label><input type="radio" name="type" value="收入"> 收入</label>
    </p>
    <p>金额：<input type="number" name="amount" step="0.01" min="0.01" required></p>
    <p>分类：<input type="text" name="category" placeholder="餐饮 / 工资 / 交通" required></p>
    <p>备注：<input type="text" name="note" placeholder="可留空"></p>
    <button type="submit">保存</button>
</form>

<h2>账单列表</h2>
<table class="ledger">
    <tr>
        <th>日期</th>
        <th>类型</th>
        <th>分类</th>
        <th>金额</th>
        <th>备注</th>
        <th>操作</th>
    </tr>
    <tr th:each="e : ${entries}">
        <td th:text="${e.createdAt}">日期</td>
        <td th:text="${e.type}">支出</td>
        <td th:text="${e.category}">分类</td>
        <td th:text="${e.amount}">0</td>
        <td th:text="${e.note}">备注</td>
        <td>
            <form th:action="@{/delete}" method="post" style="display:inline">
                <input type="hidden" name="id" th:value="${e.id}">
                <button type="submit">删除</button>
            </form>
            <a th:href="@{/edit(id=${e.id})}">编辑</a>
        </td>
    </tr>
</table>
<p th:if="${#lists.isEmpty(entries)}">还没有记录，先记一笔吧。</p>
<p th:if="${totalCount > 0}">
    共 <span th:text="${totalCount}">0</span> 条，
    第 <span th:text="${page}">1</span> /
    <span th:text="${totalPages}">1</span> 页
    <a th:if="${page > 1}" th:href="@{/(month=${month}, page=${page - 1})}">上一页</a>
    <a th:if="${page < totalPages}" th:href="@{/(month=${month}, page=${page + 1})}">下一页</a>
</p>
</div>
<script src="/js/app.js"></script>
</body>
</html>
