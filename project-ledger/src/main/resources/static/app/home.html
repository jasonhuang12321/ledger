<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的记账本 - 独立前端</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page">
    <h1>你好，<span id="who">用户</span></h1>
    <p>
        <button type="button" id="logout-btn">退出登录</button>
        <a id="admin-link" href="/app/admin.html" style="display:none;margin-left:12px">管理员：全部账单</a>
        <a href="/login" style="margin-left:12px">原来的网页版</a>
    </p>

    <div class="summary">
        <div>收入合计：<b class="income" id="income">0</b> 元</div>
        <div>支出合计：<b class="expense" id="expense">0</b> 元</div>
        <div>结余：<b id="balance">0</b> 元</div>
    </div>

    <form id="filter-form">
        <p>
            月份：
            <input type="month" id="month">
            <button type="submit">筛选</button>
            <button type="button" id="clear-month">查看全部</button>
            <button type="button" id="export-btn">导出 Excel</button>
        </p>
    </form>

    <h2>支出分类统计</h2>
    <div id="stats"></div>

    <h2>记一笔</h2>
    <p class="error" id="error"></p>
    <form id="add-form">
        <p>
            类型：
            <label><input type="radio" name="type" value="支出" checked> 支出</label>
            <label><input type="radio" name="type" value="收入"> 收入</label>
        </p>
        <p>金额：<input id="amount" type="number" step="0.01" min="0.01" required></p>
        <p>分类：<input id="category" type="text" required></p>
        <p>备注：<input id="note" type="text"></p>
        <button type="submit">保存</button>
    </form>

    <h2>账单列表</h2>
    <table class="ledger">
        <thead>
        <tr>
            <th>日期</th>
            <th>类型</th>
            <th>分类</th>
            <th>金额</th>
            <th>备注</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <p>
        <span id="pager"></span>
        <button type="button" id="prev">上一页</button>
        <button type="button" id="next">下一页</button>
    </p>
</div>
<script src="/app/js/api.js"></script>
<script src="/app/js/home.js"></script>
</body>
</html>
